server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA (React Router) : toute route inconnue de nginx (ex: /login, /crises/5
    # après un F5) doit retomber sur index.html pour que React Router la gère
    # côté client — sans ça, un simple refresh sur une route renvoie un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers statiques hashés par Vite : cache long, immuable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
